name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse script
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\Get-EntraAuthenticationReadinessReport.ps1),
              [ref]$tokens,
              [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

      - name: Run offline smoke test
        shell: powershell
        run: .\tests\Invoke-SmokeTest.ps1

  powershell-core:
    name: PowerShell Core on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./Get-EntraAuthenticationReadinessReport.ps1),
              [ref]$tokens,
              [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

      - name: Run offline smoke test
        shell: pwsh
        run: ./tests/Invoke-SmokeTest.ps1

name: Feature request
description: Suggest an improvement to reporting, usability, or documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the outcome you need rather than sharing real tenant data or report output.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or workflow should this change address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, output, or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any current workarounds or alternative designs.
  - type: textarea
    id: impact
    attributes:
      label: Security and privacy impact
      description: Note any new permissions, sensitive fields, or data-retention considerations.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This request does not contain real tenant or user data.
          required: true
        - label: I searched existing issues before submitting this request.
          required: true
